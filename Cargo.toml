[package]
authors = ["Lyam Witherow <lyam@witherow.ca>"]
categories = ["science", "no-std", "embedded", "wasm"]
description = "Native GGUF loader for Burn, with support for quantized weights"
documentation = "https://docs.rs/burn-gguf"
edition = "2024"
keywords = ["deep-learning", "machine-learning", "tensor", "gguf", "llm"]
license = "MIT OR Apache-2.0"
name = "burn-gguf"
repository = "https://github.com/Lyamc/burn-gguf"
rust-version = "1.95"
version = "0.1.0"

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"

[features]
default = ["std", "memmap"]
doc = ["default", "converter"]
std = ["burn-core/std", "burn-std/std", "burn-store/std", "burn-tensor/std", "half/std"]
# Memory-map GGUF files instead of reading them. Requires `std`.
memmap = ["std", "dep:memmap2"]
# Dequantize to SafeTensors, for compatibility checking against non-GGUF paths.
converter = ["std", "dep:safetensors", "dep:bytemuck"]
tracing = ["burn-core/tracing", "burn-tensor/tracing"]

[dependencies]
# Burn 0.22 is not on crates.io yet. This is upstream main, which is version 0.22.0.
burn-core = { git = "https://github.com/tracel-ai/burn", rev = "b8d75ad07f426537594a5beb9309d62d916bcf05", default-features = false }
burn-std = { git = "https://github.com/tracel-ai/burn", rev = "b8d75ad07f426537594a5beb9309d62d916bcf05", default-features = false }
burn-store = { git = "https://github.com/tracel-ai/burn", rev = "b8d75ad07f426537594a5beb9309d62d916bcf05", default-features = false }
burn-tensor = { git = "https://github.com/tracel-ai/burn", rev = "b8d75ad07f426537594a5beb9309d62d916bcf05", default-features = false }

# GGUF stores f16/bf16 scales and weights; `half` decodes them.
half = { version = "2.7.1", default-features = false, features = ["alloc", "num-traits", "serde"] }
# Wraps the mmap in a refcounted, sliceable allocation for zero-copy tensor reads.
bytes = { version = "1.12.1", default-features = false }
# Architecture-specific tensor name rewrites. `regex` builds without an allocator.
regex = { version = "1.13.1", default-features = false, features = ["perf", "unicode"] }
memmap2 = { version = "0.9", optional = true }
bytemuck = { version = "1.25.0", optional = true }
safetensors = { version = "0.8.0", default-features = false, optional = true }

[dev-dependencies]
burn = { git = "https://github.com/tracel-ai/burn", rev = "b8d75ad07f426537594a5beb9309d62d916bcf05", default-features = false, features = ["std", "flex"] }
burn-nn = { git = "https://github.com/tracel-ai/burn", rev = "b8d75ad07f426537594a5beb9309d62d916bcf05", default-features = false }
burn-store = { git = "https://github.com/tracel-ai/burn", rev = "b8d75ad07f426537594a5beb9309d62d916bcf05", default-features = false }
half = { version = "2.7.1", default-features = false, features = ["alloc", "num-traits", "serde"] }
tempfile = "3.27.0"

[[test]]
name = "load_module"
path = "tests/load_module.rs"

[[example]]
name = "gguf_inspect"

[[example]]
name = "make_sample"

[[example]]
name = "gguf_to_safetensors"
required-features = ["converter"]

[package.metadata.docs.rs]
features = ["doc", "converter"]
rustdoc-args = ["--cfg", "docsrs"]
